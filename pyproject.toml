[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-ledger"
version = "0.1.0"
description = "Evidence-first multi-agent market research, forecast scenarios, and revisable memory"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "mcp>=1.12,<2", "numpy>=1.26,<3", "pandas>=2.2,<4", "exchange-calendars>=4.5,<5", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
thesis-ledger = "ledger.cli:main"
thesis-ledger-mcp = "ledger.mcp_server:main"
[tool.setuptools]
packages = ["ledger"]
[tool.setuptools.package-data]
ledger = ["web/*"]
[tool.pytest.ini_options]
pythonpath = ["."]
